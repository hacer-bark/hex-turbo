[package]
name = "hex-turbo"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
build = "build.rs"
readme = "README.md"
authors = ["Hacer-Bark <hacer.bark@proton.me>"]
license = "0BSD"
description = "A Rust hex codec that peaks past 150 GiB/s, with its unsafe SIMD checked by MIRI and MSan, not just by review."
repository = "https://github.com/hacer-bark/hex-turbo"
documentation = "https://docs.rs/hex-turbo"
keywords = ["hex", "simd", "avx512", "performance", "encoding"]
categories = ["encoding", "hardware-support", "no-std", "web-programming"]
exclude = ["benches/scripts/", "benches/results/"]

[features]
default = ["std", "simd"]
unstable = []
std = []
simd = ["std"]

[dependencies]

[dev-dependencies]
rand = "0.10"
criterion = { version = "0.8", features = ["html_reports"] }
hex = "0.4"
faster-hex = "0.10"
hex-simd = "0.8"

[lints.rust]
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
unused = { level = "deny", priority = -1 }
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"

[lints.rustdoc]
all = "deny"
broken_intra_doc_links = "deny"

[[bench]]
name = "encoding_bench"
harness = false
